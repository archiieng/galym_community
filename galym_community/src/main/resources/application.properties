# Every value comes from the environment. For local runs they are read from the
# repo-root .env file (copy .env.example to .env); Docker Compose passes the same file.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:galym}}
spring.datasource.username=${POSTGRES_USER:galym}
spring.datasource.password=${POSTGRES_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Databases created before Flyway was added are adopted as version 1.
spring.flyway.baseline-on-migrate=true

# Base64-encoded HMAC key, at least 32 bytes: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
