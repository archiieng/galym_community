name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galym_frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: galym_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galym_community
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galym
          POSTGRES_USER: galym
          POSTGRES_PASSWORD: galym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galym -d galym"
          --health-interval 5s
          --health-retries 10
    env:
      # Throwaway values for the test database above; real ones live in .env.
      POSTGRES_PASSWORD: galym
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW5vdC11c2VkLWFueXdoZXJlLWVsc2UtMTIzNDU2Nzg5MA==
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Formatting, lint, then compile + tests (which run against Postgres).
      - run: ./mvnw -B spotless:check checkstyle:check verify
