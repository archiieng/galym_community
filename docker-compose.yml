# Local development stack: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: galym
      POSTGRES_USER: galym
      POSTGRES_PASSWORD: galym
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galym -d galym"]
      interval: 5s
      retries: 10

  backend:
    build: ./galym_community
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/galym
      SPRING_DATASOURCE_USERNAME: galym
      SPRING_DATASOURCE_PASSWORD: galym
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./galym_frontend
    # ponytail: host ports are pinned because the frontend hardcodes http://localhost:8080
    # and backend CORS only allows http://localhost:5173; move both to env vars to change them.
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
