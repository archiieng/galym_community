# Local stack: cp .env.example .env, fill in the secrets, then
#   docker compose up --build -d --wait
# Frontend: http://localhost:5173   API: http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Lets `psql` inside the container connect without flags (used by `npm run seed`).
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    # Reachable from this machine only, for running the backend or its tests outside
    # Docker. 5433 rather than 5432, so it does not clash with a PostgreSQL installed
    # on the host.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./galym_community
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Decides which calendar day "today" is when deadlines are compared.
      TZ: ${APP_TIMEZONE:-Asia/Almaty}
    # Host ports must match VITE_API_URL and CORS_ALLOWED_ORIGINS in .env.
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # Healthy once the web port answers, which is after the database migrations ran.
    # `docker compose up --wait` uses this to return only when the API is ready.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 5s
      retries: 30

  frontend:
    build:
      context: ./galym_frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
